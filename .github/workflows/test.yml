name: Testar site

on:
  push:
    branches: [main, interface-laboratorio-v10]
    paths: ["index.html", "tests/**", "scripts/**", "package.json", ".github/workflows/test.yml"]
  workflow_dispatch:
    inputs:
      usar_gemini:
        description: "Chamar o Gemini de verdade (usa a cota gratuita)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: teste-site
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Instalar o navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_GEMINI: ${{ github.event_name != 'workflow_dispatch' || inputs.usar_gemini }}
        run: node tests/e2e.js

      - name: Guardar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio
          path: report
          if-no-files-found: ignore


